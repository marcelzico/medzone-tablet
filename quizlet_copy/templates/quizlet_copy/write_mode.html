<div id="write-mode" class="text-center">
    <h4>Write Mode</h4>
    <p class="text-muted">Type the term for each definition shown</p>
    
    <div id="write-container">
        <div class="card mb-4">
            <div class="card-body">
                <h5 id="write-definition">Loading...</h5>
            </div>
        </div>
        
        <div class="mb-3">
            <input type="text" id="write-answer" class="form-control form-control-lg" 
                   placeholder="Type your answer here..." autocomplete="off">
        </div>
        
        <div class="mb-3">
            <button onclick="checkAnswer()" class="btn btn-primary">Check Answer</button>
            <button onclick="skipCard()" class="btn btn-outline-secondary">Skip</button>
        </div>
        
        <div id="write-feedback" class="alert" style="display: none;"></div>
        
        <div class="mt-3">
            <span id="write-progress" class="badge bg-info">0 / {{ cards|length }}</span>
            <span id="write-score" class="badge bg-success ms-2">Score: 0</span>
        </div>
    </div>
</div>

<script>
    const writeCards = [...cards];
    let writeIndex = 0;
    let writeScore = 0;
    let shuffledWriteCards = [];
    
    function initWriteMode() {
        shuffledWriteCards = [...writeCards].sort(() => Math.random() - 0.5);
        writeIndex = 0;
        writeScore = 0;
        showNextWriteCard();
    }
    
    function showNextWriteCard() {
        if (writeIndex < shuffledWriteCards.length) {
            document.getElementById('write-definition').textContent = 
                shuffledWriteCards[writeIndex].definition;
            document.getElementById('write-answer').value = '';
            document.getElementById('write-feedback').style.display = 'none';
            document.getElementById('write-progress').textContent = 
                `${writeIndex + 1} / ${shuffledWriteCards.length}`;
            document.getElementById('write-score').textContent = `Score: ${writeScore}`;
            document.getElementById('write-answer').focus();
        } else {
            document.getElementById('write-container').innerHTML = `
                <div class="alert alert-success">
                    <h4>🎉 Finished!</h4>
                    <p>You got ${writeScore} out of ${shuffledWriteCards.length} correct!</p>
                    <button onclick="initWriteMode()" class="btn btn-primary">Restart</button>
                </div>
            `;
        }
    }
    
    function checkAnswer() {
        const answer = document.getElementById('write-answer').value.trim();
        const correctAnswer = shuffledWriteCards[writeIndex].term;
        const feedback = document.getElementById('write-feedback');
        
        if (answer.toLowerCase() === correctAnswer.toLowerCase()) {
            feedback.className = 'alert alert-success';
            feedback.innerHTML = `<strong>✓ Correct!</strong> The answer is "${correctAnswer}"`;
            writeScore++;
        } else {
            feedback.className = 'alert alert-danger';
            feedback.innerHTML = `<strong>✗ Incorrect.</strong> The correct answer is "${correctAnswer}"`;
        }
        
        feedback.style.display = 'block';
        writeIndex++;
        
        setTimeout(() => {
            showNextWriteCard();
        }, 1500);
    }
    
    function skipCard() {
        const correctAnswer = shuffledWriteCards[writeIndex].term;
        const feedback = document.getElementById('write-feedback');
        
        feedback.className = 'alert alert-warning';
        feedback.innerHTML = `<strong>Skipped.</strong> The answer was "${correctAnswer}"`;
        feedback.style.display = 'block';
        
        writeIndex++;
        
        setTimeout(() => {
            showNextWriteCard();
        }, 1000);
    }
    
    // Enter key to check answer
    document.getElementById('write-answer').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            checkAnswer();
        }
    });
    
    initWriteMode();
</script>
