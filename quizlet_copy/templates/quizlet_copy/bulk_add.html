{% extends 'base.html' %}

{% block title %}Ajouter plusieurs cartes mentales à la fois{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <h3>Ajouter plusieurs cartes mentales à la fois sur "{{ set.title }}"</h3>
            </div>
            <div class="card-body">
                <form method="POST">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label class="form-label">Taper la carte mentale (une par ligne):</label>
                        <textarea name="bulk_data" class="form-control" rows="10" 
                                  placeholder="Term : Definition
Example:
Dog : A furry animal that barks
Cat : A furry animal that meows
Python : A programming language
HTML : HyperText Markup Language"></textarea>
                        <div class="form-text">
                            Format: <code>Terme : Définition</code> (Séparé par un deux point)
                        </div>
                    </div>
                    
                    <div class="d-flex justify-content-between">
                        <a href="{% url 'quizlet_copy:set-detail' set.pk %}" class="btn btn-secondary">
                            Annuler
                        </a>
                        <button type="submit" class="btn btn-primary">
                            Ajouter toutes les cartes mentales
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
